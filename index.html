<style>

.entry{width:100%;border:0;background:#fff9;border-radius:16px;padding:13px;text-align:left;margin-bottom:8px;color:var(--ink);cursor:pointer}.entry strong{display:block}.entry small{color:var(--muted)}

.gamegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.gamecard{aspect-ratio:1;border:0;border-radius:14px;background:#eadcf6;font-size:25px;cursor:pointer}.gamecard.matched{background:#d6f0dc}.collectarea{height:210px;border-radius:20px;background:linear-gradient(#f8e7f2,#e2e5fb);position:relative;overflow:hidden}.collect{position:absolute;border:0;background:transparent;font-size:35px;cursor:pointer;animation:bob 1.6s infinite alternate}.collect img{background:transparent;mix-blend-mode:normal}@keyframes bob{to{transform:translateY(-9px) rotate(9deg)}}.stat{font-weight:800;text-align:center;margin:9px}

.settingsrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.settingsrow input[type=range]{width:115px;accent-color:#c875a0}.settingsrow select{border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;color:var(--ink)}

body.dark{--ink:#f8eaf4;--muted:#d0b8cb;--panel:#45384d;--line:#68556e;--wall:radial-gradient(circle at 15% 20%,#ffffff10 0 4%,transparent 4.5%),linear-gradient(145deg,#392c49,#51415f 65%,#33495c)}body.dark .appscreen{background:linear-gradient(160deg,#403349f2,#514057f2)}body.dark .card,body.dark .widget,body.dark .dock,body.dark .appicon .tile,body.dark .back,body.dark .homebtn,body.dark .pad button{background:#ffffff12;border-color:#ffffff20;color:var(--ink)}body.dark .letter{color:#493746}
body.noanim *{animation:none!important;transition:none!important}
/* Full-screen phone + tactile motion without lingering touch marks */
button,[role="button"],input,select{-webkit-tap-highlight-color:transparent;outline:none}
button:focus,button:focus-visible{outline:none;box-shadow:none}button::-moz-focus-inner{border:0} .appicon .tile{will-change:transform} .appicon:hover .tile{transform:translateY(-4px) rotate(-3deg)} .memory:hover{transform:translateY(-3px)} .flower:hover{transform:translateY(-3px) rotate(-3deg)}
button{transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s}
button:active{transform:scale(.94);filter:brightness(1.04)}
.pad button:active{animation:keyPop .24s ease-out}
#lock{padding-top:calc(62px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#home{padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#appHost{padding-top:calc(42px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.loopy-peeker{position:absolute;z-index:25;right:-23px;top:36%;width:92px;height:112px;object-fit:contain;pointer-events:none;animation:peekSide 7s ease-in-out infinite;filter:drop-shadow(0 5px 5px #72516c12)}
.loopy-walker{position:absolute;z-index:2;left:-90px;bottom:112px;width:62px;height:76px;object-fit:contain;pointer-events:none;animation:walkAcross 13s ease-in-out infinite;filter:drop-shadow(0 4px 4px #72516c18)}
.loopy-banner img,.loopy-deco,.loopy-peeker,.loopy-walker,.loopy img,.art img,.character .avatar img,.collect img,.appicon .tile img,.track-art img{background:transparent!important;mix-blend-mode:normal!important;object-fit:contain}
@keyframes loopyFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes peek{0%,32%,100%{transform:translateX(16px) rotate(8deg)}42%,62%{transform:translateX(-2px) rotate(-5deg)}72%{transform:translateX(5px) rotate(4deg)}}
@keyframes peekSide{0%,12%,72%,100%{transform:translateX(48px) rotate(10deg)}20%,62%{transform:translateX(-4px) rotate(-5deg)}66%{transform:translateX(0) rotate(3deg)}}
@keyframes walkAcross{0%{left:-90px;transform:translateY(0) scaleX(1)}8%{transform:translateY(-4px) scaleX(1)}15%{transform:translateY(1px) scaleX(1)}32%{left:calc(100% + 10px);transform:translateY(-2px) scaleX(1)}33%{left:calc(100% + 10px);transform:translateY(0) scaleX(-1)}64%{left:-90px;transform:translateY(-2px) scaleX(-1)}65%,100%{left:-90px;transform:translateY(0) scaleX(1)}}
@keyframes keyPop{0%{transform:scale(1)}45%{transform:scale(.88)}100%{transform:scale(1)}}
/* Richer character animation: continuous gait, anticipation, weight shifts and springy landings */
.loopy{animation:loopyAlive 4.2s cubic-bezier(.45,.05,.55,.95) infinite;transform-origin:50% 88%;will-change:transform}
.loopy img{animation:loopyPose 4.2s ease-in-out infinite;transform-origin:50% 90%;will-change:transform}
.loopy-peeker{transform-origin:75% 90%;animation:peekAdventure 8.6s cubic-bezier(.4,0,.2,1) infinite;will-change:transform}
.loopy-walker{transform-origin:50% 90%;animation:walkCycle 11s linear infinite;will-change:left,transform}
.loopy-deco{transform-origin:50% 95%;animation:decoDance 5.3s ease-in-out infinite;will-change:transform}
.loopy-banner img{transform-origin:50% 90%;animation:bannerBounce 3.8s ease-in-out infinite;will-change:transform}
.collect img{animation:collectWiggle 1.9s ease-in-out infinite;transform-origin:50% 85%}
@keyframes loopyAlive{0%,100%{transform:translateY(0) rotate(-4deg) scale(1,1)}12%{transform:translateY(-3px) rotate(1deg) scale(1.02,.98)}26%{transform:translateY(-13px) rotate(5deg) scale(.97,1.04)}38%{transform:translateY(-5px) rotate(-2deg) scale(1.04,.96)}49%{transform:translateY(0) rotate(-5deg) scale(1.01,.99)}63%{transform:translateY(-7px) rotate(2deg) scale(.99,1.02)}78%{transform:translateY(-2px) rotate(-1deg) scale(1.02,.98)}}

@keyframes decoDance{0%,100%{transform:translate(8px,4px) rotate(7deg) scale(.97)}18%{transform:translate(-1px,-4px) rotate(-5deg) scale(1.02)}34%{transform:translate(-3px,0) rotate(-9deg) scale(1)}49%{transform:translate(1px,-5px) rotate(4deg) scale(1.03)}66%{transform:translate(-2px,0) rotate(-3deg) scale(.99)}82%{transform:translate(4px,-2px) rotate(6deg) scale(1.01)}}
@keyframes bannerBounce{0%,100%{transform:translateY(0) rotate(-2deg)}30%{transform:translateY(-5px) rotate(3deg)}52%{transform:translateY(1px) rotate(-2deg)}74%{transform:translateY(-3px) rotate(2deg)}}

/* Cards feel tactile and photos remain undistorted */
.memory{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,filter .25s;will-change:transform}
.memory:active{transform:scale(.96) rotate(-.6deg);box-shadow:0 2px 8px #79587522}
.memory .art img{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.memory:hover .art img{transform:scale(1.045)}
.modal.show .modalbox{animation:modalSpring .46s cubic-bezier(.2,1.3,.4,1) both}

if(name==='Diary')return `<div class="card"><b>Pages from the pocket diary</b><p class="muted">A few prewritten notes for slow moments.</p></div><div id="diaryList">${diary.map((d,i)=>`<button class="entry" data-diary="${i}"><small>${d[0]}</small><strong>${d[1]}</strong><small>Open entry →</small></button>`).join('')}</div><div id="diaryEntry"></div><div class="card"><label for="note" style="font-weight:800">Your own little note</label><p class="muted">Saved only on this device.</p><textarea id="note" rows="3" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:#fff9;color:var(--ink)" placeholder="Write a thought..."></textarea><button class="primary" id="saveNote" style="margin-top:8px">Save note</button><p id="savedNote" class="muted"></p></div>`;
if(name==='Surprise Box')return `<div class="card"><b>A little birthday surprise</b><p class="muted">There's something tucked inside. Tap the gift to open it and let the birthday confetti fly.</p><div class="gift-stage" id="giftStage"><div class="surprise-note" id="surpriseNote">You deserve a day full of tiny joys, loud laughs, good people, and all the sweetness you give away so easily. Happy birthday! ♡</div><div class="gift" id="birthdayGift" role="button" tabindex="0" aria-label="Open birthday gift"><div class="gift-box"></div><div class="gift-ribbon"></div><div class="gift-lid"></div><div class="gift-bow"></div></div></div><button class="birthday-btn" id="openGift" style="width:100%">Open your surprise</button><button class="secondary" id="giftAgain" style="width:100%;margin-top:8px">Wrap it again</button><div class="message" id="giftMessage">A gift is better when there's a little mystery.</div></div>`;
if(name==='About')return `<div class="card character"><div class="avatar"><img src="https://assets.stickpng.com/images/5a9fbfb39fc609199d0ff15d.png" alt="Loopy" onerror="this.style.display='none'"></div><div><b>Loopy</b><p class="muted">Chief joy officer. Specialist in dramatic poses, pastel dreams, and surprise smiles.</p></div></div><div class="card character"><div class="avatar"><img src="${loopyPics[2]}" alt="Loopy sticker"></div><div><b>The little phone</b><p class="muted">A tiny offline world made for exploring, remembering, and playing at your own pace.</p></div></div><div class="card"><b>Loopy's silly gallery</b><p class="muted">Tap a pose to give Loopy a new mood.</p><div class="gallery">${[[loopyPics[0],'Loopy in pink'],[loopyPics[1],'Flower Loopy'],[loopyPics[2],'Manager Loopy'],[loopyPics[3],'Flower pose'],[loopyPics[4],'Loopy portrait'],[loopyPics[5],'Sticker Loopy']].map((x,i)=>`<button class="memory" data-pose="${i}"><div class="art"><img src="${loopyPics[i]}" alt="${x[1]}" onerror="this.style.display='none'"></div><strong>${x[1]}</strong><small>Tap to interact</small></button>`).join('')}</div><div id="poseMsg" class="message">Loopy says hi! ♡</div></div>`;
if(name==='Settings')return `<div class="card"><b>Make it yours</b><div class="settingsrow"><span>Theme</span><select id="themeSelect"><option value="pink">Pastel pink</option><option value="lilac">Dreamy lilac</option><option value="mint">Mint cream</option></select></div><div class="settingsrow"><span>Sound effects</span><input id="soundToggle" type="checkbox" ${state.sound?'checked':''}></div><div class="settingsrow"><span>Volume</span><input id="volume" type="range" min="0" max="100" value="${state.volume}"><span id="volumeLabel">${state.volume}%</span></div><div class="settingsrow"><span>Animations</span><input id="animationToggle" type="checkbox" ${state.animations?'checked':''}></div><button class="secondary" id="resetPrefs" style="width:100%;margin-top:14px">Reset preferences</button><p class="muted">Preferences are stored locally on this device. No account or connection needed.</p></div><div class="card"><b>Offline by design</b><p class="muted">Core interactions run in this page. For offline music, keep audio files in the local <code>audio/</code> folder and host this project as static files.</p></div>`;
}
function gameCards(){return ['🐰','🎀','💗','🌷','⭐','🍓','🐰','🎀','💗','🌷','⭐','🍓']}
function wireApp(name){
if(name==='Letter'){const open=()=>{const e=$('#envelope');e.classList.add('open');$('#openLetter').style.display='none';$('#closeLetter').style.display='block';toast('A letter, sealed with love')};const close=()=>{ $('#envelope').classList.remove('open');$('#openLetter').style.display='block';$('#closeLetter').style.display='none';toast('Letter folded safely')};$('#openLetter').onclick=open;$('#envelope').onclick=open;$('#envelope').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};$('#closeLetter').onclick=close}
if(name==='Gallery')$$('[data-memory]').forEach(b=>b.onclick=()=>showMemory(+b.dataset.memory));
if(name==='Music')setupMusic();
if(name==='Birthday Cake'){
 const candles=$$('.candle');let micStream=null,micContext=null,micFrame=0,blowSince=0,quietSince=0,baseline=.004,holdActive=false,blowTriggered=false,lastRms=0;
 const status=$('#micStatus'),button=$('#micBlow'),panel=$('#micPermission'),promptTitle=$('#micPromptTitle'),hint=$('#blowHint');
 const remaining=()=>candles.filter(c=>!c.classList.contains('out')).length;
 const setMicState=(kind,title,message)=>{panel.classList.toggle('ready',kind==='ready');panel.classList.toggle('error',kind==='error');promptTitle.textContent=title;status.textContent=message;};
 const updateCake=()=>{const n=remaining();$('#cakeCaption').textContent=n===0?'All candles are out — happy birthday!':`${n} candle${n===1?'':'s'} still glowing`;if(n===0){setMicState('ready','Birthday wish unlocked!','You did it! The candles are out. Entering your home screen…');hint.textContent='Happy birthday ♡';stopMic();button.disabled=true;button.classList.remove('holding');setTimeout(()=>{state.birthdayGate=false;state.app=null;$('#appHost').classList.remove('gate');showScreen('home');toast('Happy birthday! Welcome home ♡')},1000);}};
 const extinguishOne=()=>{const next=candles.find(c=>!c.classList.contains('out'));if(!next)return;next.classList.add('out');next.animate([{transform:'scale(1)',opacity:1,filter:'brightness(1)'},{transform:'scale(.12) translateY(-15px)',opacity:0,filter:'brightness(2)'}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'});if(state.sound)beep(520,.08);updateCake();if(remaining()>0){setMicState('ready','Nice blow!','One candle is out. Keep holding and blow again when the microphone is ready for the next puff.');hint.textContent='One down! Keep holding and blow again for the next candle.';}else{confetti($('.birthday-stage'));$('#wishMessage').textContent='All candles are out. Your birthday surprise is unlocked!';}};
 function stopMic(){if(micFrame)cancelAnimationFrame(micFrame);micFrame=0;holdActive=false;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}if(micContext){micContext.close().catch(()=>{});micContext=null}blowSince=0;}
 async function requestMic(){
   if(micStream){button.disabled=false;setMicState('ready','Microphone ready','Press and hold the round button while blowing toward your phone.');return true;}
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setMicState('error','Microphone not available','This browser cannot access the microphone here. Open the page from a secure HTTPS website, then reload.');hint.textContent='Microphone access needs HTTPS and a supported browser.';button.disabled=false;return false;}
   button.disabled=true;setMicState('','Waiting for permission…','Your browser should ask for microphone access. Choose Allow to continue.');
   try{
     micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
     const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio analyser unavailable');
     micContext=new AC();await micContext.resume();const source=micContext.createMediaStreamSource(micStream);const analyser=micContext.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.08;source.connect(analyser);const data=new Uint8Array(analyser.fftSize);
     baseline=.006;button.disabled=false;setMicState('ready','Microphone ready','Hold the round button like a voice note and blow toward the phone. Keep holding while you blow.');hint.textContent='Hold the button and blow three separate short puffs. Keep holding the whole time.';
     const listen=()=>{if(!micStream||!micContext)return;analyser.getByteTimeDomainData(data);let sum=0,peak=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v;peak=Math.max(peak,Math.abs(v));}const rms=Math.sqrt(sum/data.length);lastRms=rms;const now=performance.now();
       const threshold=Math.max(.011,baseline*1.22,baseline+.005);
       if(!holdActive){
         baseline=baseline*.96+rms*.04;blowSince=0;quietSince=0;blowTriggered=false;
       }else{
         // More sensitive detection, with a quiet gap between puffs so one hold can extinguish all 3 candles.
         if(!blowTriggered){
           if(rms>threshold&&peak>.028){
             quietSince=0;
             if(!blowSince)blowSince=now;
             if(now-blowSince>115){blowTriggered=true;blowSince=0;quietSince=0;extinguishOne();}
           }else{
             blowSince=0;
           }
         }else{
           if(rms<threshold*.72){
             if(!quietSince)quietSince=now;
             if(now-quietSince>105){blowTriggered=false;quietSince=0;}
           }else{
             quietSince=0;
           }
         }
       }
       micFrame=requestAnimationFrame(listen);
     };listen();return true;
   }catch(err){
     stopMic();button.disabled=false;
     const denied=err&&err.name==='NotAllowedError';
     setMicState('error',denied?'Microphone permission denied':'Could not start microphone',denied?'Allow microphone access in your browser’s site settings, then reload or try again.':'Microphone could not start. Check HTTPS and the browser permission, then reload.');
     hint.textContent='The candle challenge needs microphone access to continue.';return false;
   }
 }
 const startHold=async e=>{if(e.cancelable)e.preventDefault();if(button.disabled)return;if(!micStream){await requestMic();if(!micStream)return;}if(micContext&&micContext.state==='suspended')await micContext.resume();holdActive=true;blowTriggered=false;blowSince=0;quietSince=0;button.classList.add('holding');try{button.setPointerCapture?.(e.pointerId)}catch(_){}setMicState('ready','Listening while held…','Keep holding and blow toward the microphone. Keep holding; pause briefly between each blow.');};
 const endHold=e=>{if(e&&e.cancelable)e.preventDefault();holdActive=false;blowSince=0;quietSince=0;blowTriggered=false;button.classList.remove('holding');if(micStream&&remaining()>0)setMicState('ready','Ready for the next blow','Keep holding and blow again when ready.');};
 button.addEventListener('pointerdown',startHold);button.addEventListener('pointerup',endHold);button.addEventListener('pointercancel',endHold);button.addEventListener('lostpointercapture',endHold);button.addEventListener('contextmenu',e=>e.preventDefault());
 button.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();startHold(e)}});button.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();endHold(e)}});
 // Ask on entry. If permission is denied, the same round button remains available for retry.
 requestMic();
}
if(name==='Surprise Box'){const open=()=>{if($('#birthdayGift').classList.contains('open'))return;$('#birthdayGift').classList.add('open');$('#surpriseNote').classList.add('show');$('#giftMessage').textContent='Surprise! This little message is all yours.';$('#openGift').textContent='Surprise opened';confetti($('#giftStage'));if(state.sound)beep(760,.12)};const close=()=>{$('#birthdayGift').classList.remove('open');$('#surpriseNote').classList.remove('show');$('#giftMessage').textContent='The mystery is back inside the box.';$('#openGift').textContent='Open your surprise'};$('#birthdayGift').onclick=open;$('#birthdayGift').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};$('#openGift').onclick=open;$('#giftAgain').onclick=close}
if(name==='Diary'){ $$('[data-diary]').forEach(b=>b.onclick=()=>{const d=diary[+b.dataset.diary];$('#diaryEntry').innerHTML=`<div class="letter"><small>${d[0]}</small><h3>${d[1]}</h3><p>${d[2]}</p><button class="secondary" id="closeEntry">Close entry</button></div>`;$('#closeEntry').onclick=()=>$('#diaryEntry').innerHTML=''});$('#note').value=localStorage.getItem('loopy-note')||'';$('#saveNote').onclick=()=>{try{localStorage.setItem('loopy-note',$('#note').value);$('#savedNote').textContent='Saved on this device ♡';toast('Your note is saved')}catch(e){toast('Could not save on this device')}}}

if(name==='About'){$$('[data-pose]').forEach(b=>b.onclick=()=>{$('#poseMsg').textContent=['Loopy is hiding behind those ears.','Loopy thinks they are the main character.','Loopy needs a tiny hug.','Party mode: maximum sparkle!','Five more minutes, please.','Zero thoughts, just vibes.'][+b.dataset.pose];toast('Loopy mood changed!')})}
if(name==='Settings')setupSettings();
}
function showMemory(i){state.mem=i;const m=memories[i];$('#modalArt').innerHTML=`<img src="${m[3]||loopyPics[i]||loopyPics[0]}" alt="${m[0]}" onerror="this.parentElement.textContent='Photo unavailable'">`;$('#modalTitle').textContent=m[0];$('#modalText').textContent=m[1];$('#modal').classList.add('show')}
function closeMemory(){$('#modal').classList.remove('show')}
$('#closeModal').onclick=closeMemory;$('#prevItem').onclick=()=>showMemory((state.mem+memories.length-1)%memories.length);$('#nextItem').onclick=()=>showMemory((state.mem+1)%memories.length);$('#modal').onclick=e=>{if(e.target.id==='modal')closeMemory()};
function confetti(target){if(!target)return;for(let i=0;i<26;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=(Math.random()*96+2)+'%';bit.style.setProperty('--c',['#f39cc4','#c6b4f5','#ffd36e','#9adfca','#f7f0ff'][i%5]);bit.style.setProperty('--drift',(Math.random()*110-55)+'px');target.appendChild(bit);setTimeout(()=>bit.remove(),1900)}}
function setupMusic(){const audio=$('#audio');audio.volume=state.volume/100;function update(){const t=tracks[state.track];$('#trackArt').innerHTML=`<img src="${t[2]}" alt="${t[0]}">`;$('#trackTitle').textContent=t[0];$('#trackSub').textContent=t[1];$('#progress').value=audio.duration?audio.currentTime/audio.duration*100:0;$('#elapsed').textContent=fmt(audio.currentTime||0);$('#duration').textContent=fmt(audio.duration||0);$('#playTrack').textContent=audio.paused?'▶':'Ⅱ'}function load(i){state.track=(i+tracks.length)%tracks.length;audio.pause();audio.src=tracks[state.track][3];audio.load();$('#audioStatus').textContent='Trying local file: '+tracks[state.track][3];update();$$('[data-track]').forEach(b=>b.querySelector('small').textContent=+b.dataset.track===state.track?'Selected':'Tap to select')}audio.onloadedmetadata=update;audio.ontimeupdate=update;audio.onended=()=>load(state.track+1);audio.onerror=()=>{$('#audioStatus').textContent='Audio file not found. Add '+tracks[state.track][3]+' to your project; the rest of the app still works.';$('#playTrack').textContent='▶'};$('#playTrack').onclick=async()=>{if(!audio.src)load(state.track);if(audio.paused){try{await audio.play();$('#audioStatus').textContent='Now playing locally ♡'}catch(e){$('#audioStatus').textContent='Could not play audio. Check that the local file exists.';toast('Local audio unavailable')}}else audio.pause();update()};$('#prevTrack').onclick=()=>load(state.track-1);$('#nextTrack').onclick=()=>load(state.track+1);$('#progress').oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*(+$('#progress').value/100)};$$('[data-track]').forEach(b=>b.onclick=()=>load(+b.dataset.track));load(state.track)}
function fmt(n){if(!isFinite(n))return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}
function setupGame(){let vals=gameCards(),revealed=[],matched=[];const grid=$('#gameGrid');function draw(){grid.innerHTML=vals.map((v,i)=>`<button class="gamecard ${matched.includes(i)?'matched':''}" data-game="${i}">${revealed.includes(i)||matched.includes(i)?v:'❔'}</button>`).join('');$('#gameStat').textContent=`Pairs found: ${matched.length/2} / 6`;$$('[data-game]').forEach(b=>b.onclick=()=>{const i=+b.dataset.game;if(matched.includes(i)||revealed.includes(i)||revealed.length===2)return;revealed.push(i);draw();if(revealed.length===2){if(vals[revealed[0]]===vals[revealed[1]]){matched.push(...revealed);revealed=[];draw();if(matched.length===12)toast('You found every pair! Amazing ♡')}else setTimeout(()=>{revealed=[];draw()},650)}})}function reset(){vals=gameCards().sort(()=>Math.random()-.5);revealed=[];matched=[];draw()}$('#resetGame').onclick=reset;reset();$$('.collect').forEach(b=>b.onclick=()=>{state.score++;$('#score').textContent=state.score;b.style.left=Math.floor(Math.random()*70)+'%';b.style.top=Math.floor(Math.random()*70)+'%';b.style.transform='scale(1.2)';if(state.sound)beep(780,0.07);if(state.score%5===0)toast('Five little treasures collected! ✨')})}
function setupSettings(){const theme=$('#themeSelect');theme.value=state.theme;theme.onchange=()=>setTheme(theme.value);$('#soundToggle').onchange=e=>{state.sound=e.target.checked;toast(state.sound?'Sound effects on':'Sound effects off')};$('#volume').oninput=e=>{state.volume=+e.target.value;$('#volumeLabel').textContent=state.volume+'%';$('#audio').volume=state.volume/100};$('#animationToggle').onchange=e=>{state.animations=e.target.checked;document.body.classList.toggle('noanim',!state.animations);toast(state.animations?'Animations enabled':'Animations disabled')};$('#resetPrefs').onclick=()=>{state.sound=true;state.volume=70;state.animations=true;state.theme='pink';persistPrefs();openApp('Settings');toast('Preferences reset')}}
function setTheme(t){state.theme=t;const themes={pink:['#f7dce8','#eaa5c5','#b9a8ef'],lilac:['#e5defb','#b5a4e9','#f0b8d7'],mint:['#d9f0e5','#9ed8c0','#b6c6f0']};const v=themes[t]||themes.pink;document.documentElement.style.setProperty('--bg',v[0]);document.documentElement.style.setProperty('--accent',v[1]);document.documentElement.style.setProperty('--accent2',v[2]);document.documentElement.style.setProperty('--wall',`radial-gradient(circle at 15% 20%,#fff9 0 4%,transparent 4.5%),linear-gradient(145deg,${v[0]},${v[2]})`);persistPrefs();toast('Theme updated ♡')}
function persistPrefs(){try{localStorage.setItem('loopy-prefs',JSON.stringify({sound:state.sound,volume:state.volume,animations:state.animations,theme:state.theme}))}catch(e){}}
function beep(freq,duration){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.stop(c.currentTime+duration);o.onended=()=>c.close()}catch(e){}}
function tick(){const d=new Date();const time=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});$('#statusTime').textContent=time;$('#lockClock').textContent=time;$('#lockDate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});$('#homeDate').textContent='Happy birthday';}
try{const p=JSON.parse(localStorage.getItem('loopy-prefs')||'null');if(p){Object.assign(state,p);document.body.classList.toggle('noanim',!state.animations);if(state.theme!=='pink')setTheme(state.theme)}}catch(e){}
buildIcons();tick();setInterval(tick,1000);
})();
</script></body></html>
